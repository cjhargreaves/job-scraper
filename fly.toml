# fly.toml app configuration file generated for internship-agent on 2026-09-03T16:16:35-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'internship-agent'
primary_region = 'sjc'

[build]
[[mounts]]
  source = 'jobs_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
