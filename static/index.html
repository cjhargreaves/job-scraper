<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job finder</title>
<style>
  :root {
    --theme: #ffffff;
    --entry: #ffffff;
    --primary: #1e1e1e;
    --content: #2b2b2b;
    --secondary: #6c6c6c;
    --tertiary: #f2f2f2;
    --border: #e6e6e6;
    --link: #1e1e1e;
    --good: #2f8a57;
    --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --theme: #1d1e20;
      --entry: #2e2e33;
      --primary: #dadadb;
      --content: #c4c4c5;
      --secondary: #9b9c9d;
      --tertiary: #414244;
      --border: #3a3a3f;
      --link: #dadadb;
      --good: #6cc391;
      --bad: #e57373;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--theme);
    color: var(--content);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
  }
  header .bar { max-width: 900px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 22px; font-weight: 700; color: var(--primary); }
  nav { display: flex; gap: 22px; }
  nav a { color: var(--secondary); text-decoration: none; font-size: 16px; }
  nav a:hover { color: var(--primary); }
  nav a.active { color: var(--primary); font-weight: 500; border-bottom: 2px solid currentColor; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 24px 80px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.2; color: var(--primary); }
  .count { color: var(--secondary); font-size: 14px; }
  .title { margin: 12px 0 28px; }
  .title .count { display: block; margin-top: 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select, button, a.button {
    font: inherit;
    font-size: 14px;
    color: var(--primary);
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
  }
  input[type=search] { flex: 1; min-width: 220px; }
  input:focus, select:focus { outline: none; border-color: var(--secondary); }
  button, a.button { cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover, a.button:hover { background: var(--tertiary); }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--theme); font-weight: 600; }
  button.primary:hover { opacity: 0.85; background: var(--primary); }
  button:disabled { opacity: 0.5; cursor: default; }
  .panel { background: var(--entry); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  .panel-label { font-size: 13px; color: var(--secondary); margin-bottom: 10px; }
  details.log { margin-top: 12px; }
  details.log summary { cursor: pointer; color: var(--secondary); font-size: 13px; }
  details.log pre { margin: 8px 0 0; padding: 12px; max-height: 220px; overflow: auto; background: var(--tertiary); border-radius: 6px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--content); white-space: pre-wrap; }
  .filters { margin-bottom: 32px; }
  .company { background: var(--entry); border: 1px solid var(--border); border-radius: 8px; padding: 0 24px; margin-bottom: 16px; }
  .company summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 18px 0; }
  .company summary::-webkit-details-marker { display: none; }
  .company h2 { margin: 0; font-size: 24px; line-height: 1.3; color: var(--primary); }
  .company .chevron { margin-left: auto; color: var(--secondary); transition: transform 0.15s; }
  .company[open] .chevron { transform: rotate(90deg); }
  .company[open] { padding-bottom: 8px; }
  .job { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); }
  .role { font-size: 17px; font-weight: 500; color: var(--primary); line-height: 1.4; }
  .meta { margin-top: 3px; font-size: 13.5px; color: var(--secondary); }
  .meta .sep { margin: 0 6px; }
  .actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
  .icon.applied:hover { color: var(--good); border-color: var(--good); }
  .icon.trashed:hover { color: var(--bad); border-color: var(--bad); }
  .empty { text-align: center; color: var(--secondary); padding: 60px 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--theme); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) {
    header .bar, main { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 28px; }
    .company { padding: 16px 16px 4px; }
    .job { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Job finder</span>
    <nav><a href="/">Open</a><a href="/applied">Applied</a><a href="/trash">Trash</a></nav>
  </div>
</header>
<main>
  <div class="title"><h1 id="heading"></h1><span class="count" id="count"></span></div>
  <section class="panel" id="finder" hidden>
    <div class="panel-label">Find new roles</div>
    <div class="toolbar">
      <select id="mode">
        <option value="internship">Summer internship 2027</option>
        <option value="newgrad">New grad 2027</option>
      </select>
      <button class="primary" id="boards" title="Free. Pulls straight from Greenhouse, Lever, Ashby and Simplify">Check job boards</button>
      <button id="search" title="Paid. Runs Firecrawl searches and Grok">Full web search</button>
      <span class="count" id="status"></span>
    </div>
    <details class="log" id="logWrap" hidden><summary>Search log</summary><pre id="log"></pre></details>
  </section>
  <div class="toolbar filters">
    <input type="search" id="query" placeholder="Search company, role, location">
    <select id="kind">
      <option value="">All kinds</option>
      <option value="internship">Internships</option>
      <option value="newgrad">New grad</option>
    </select>
    <select id="source"></select>
  </div>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
const VIEWS = {
  "/": { status: "new", title: "Open roles", actions: ["applied", "trashed"] },
  "/applied": { status: "applied", title: "Applied", actions: ["new", "trashed"] },
  "/trash": { status: "trashed", title: "Trash", actions: ["new", "applied"] },
};
const ACTIONS = {
  applied: { icon: "&#10003;", title: "Mark applied" },
  trashed: { icon: "&#10005;", title: "Trash" },
  new: { icon: "&#8634;", title: "Move back to open" },
};
const SOURCES = [
  ["greenhouse.io", "Greenhouse"],
  ["lever.co", "Lever"],
  ["ashbyhq.com", "Ashby"],
  ["myworkdayjobs.com", "Workday"],
  ["workable.com", "Workable"],
  ["smartrecruiters.com", "SmartRecruiters"],
  ["linkedin.com", "LinkedIn"],
  ["ycombinator.com", "YC"],
  ["workatastartup.com", "YC"],
];
const KIND_LABELS = { internship: "Internship", newgrad: "New grad" };
const VIEW = VIEWS[location.pathname] || VIEWS["/"];

const searchButton = document.getElementById("search");
const boardsButton = document.getElementById("boards");
const modeSelect = document.getElementById("mode");
const kindSelect = document.getElementById("kind");
const sourceSelect = document.getElementById("source");
const queryInput = document.getElementById("query");
const statusText = document.getElementById("status");
const countText = document.getElementById("count");
const logWrap = document.getElementById("logWrap");
const logBox = document.getElementById("log");
const list = document.getElementById("list");
const toast = document.getElementById("toast");
let jobs = [];

document.getElementById("heading").textContent = VIEW.title;
document.getElementById("finder").hidden = VIEW.status !== "new";
for (const link of document.querySelectorAll("nav a")) {
  link.classList.toggle("active", link.getAttribute("href") === location.pathname);
}

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, char => `&#${char.charCodeAt(0)};`);
}

function sourceOf(url) {
  const hit = SOURCES.find(([host]) => url.includes(host));
  return hit ? hit[1] : "Careers";
}

function shortLocation(location) {
  const places = String(location || "").split(/;\s*/).filter(Boolean);
  if (places.length <= 2) return places.join("; ");
  return `${places.slice(0, 2).join("; ")} +${places.length - 2} more`;
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 3500);
}

async function loadJobs() {
  const response = await fetch(`/api/jobs?status=${VIEW.status}`);
  jobs = await response.json();
  for (const job of jobs) job.source = sourceOf(job.url);
  const current = sourceSelect.value;
  const names = [...new Set(jobs.map(job => job.source))].sort();
  sourceSelect.innerHTML = `<option value="">All sources</option>` + names.map(name => `<option>${esc(name)}</option>`).join("");
  sourceSelect.value = names.includes(current) ? current : "";
  render();
}

function visibleJobs() {
  const query = queryInput.value.trim().toLowerCase();
  return jobs.filter(job =>
    (!kindSelect.value || job.kind === kindSelect.value) &&
    (!sourceSelect.value || job.source === sourceSelect.value) &&
    (!query || `${job.company} ${job.role} ${job.location}`.toLowerCase().includes(query)));
}

function jobRow(job) {
  const autoApply = VIEW.status === "new" && job.source === "Greenhouse"
    ? `<button data-auto="${job.id}" title="Open and fill the Greenhouse form">Auto apply</button>`
    : "";
  const buttons = VIEW.actions.map(status =>
    `<button class="icon ${status}" data-id="${job.id}" data-status="${status}" title="${ACTIONS[status].title}">${ACTIONS[status].icon}</button>`).join("");
  const meta = [shortLocation(job.location), job.source, KIND_LABELS[job.kind] || job.kind]
    .filter(Boolean).map(esc).join(`<span class="sep">&middot;</span>`);
  return `
    <div class="job">
      <div>
        <div class="role">${esc(job.role)}</div>
        <div class="meta" title="${esc(job.location)}">${meta}</div>
      </div>
      <div class="actions">${autoApply}<a class="button" href="${esc(job.url)}" target="_blank" rel="noopener">Apply</a>${buttons}</div>
    </div>`;
}

function render() {
  const shown = visibleJobs();
  const groups = new Map();
  for (const job of shown) {
    const key = job.company.trim().toLowerCase() || "unknown";
    if (!groups.has(key)) groups.set(key, { name: job.company.trim() || "Unknown", jobs: [] });
    groups.get(key).jobs.push(job);
  }
  countText.textContent = `${shown.length} roles at ${groups.size} companies`;
  if (!shown.length) {
    list.innerHTML = `<div class="empty">Nothing here.</div>`;
    return;
  }
  const sorted = [...groups.entries()].sort((left, right) => left[1].name.localeCompare(right[1].name));
  list.innerHTML = sorted.map(([key, group]) => `
    <details class="company" data-key="${esc(key)}" ${openCompanies.has(key) ? "open" : ""}>
      <summary>
        <h2>${esc(group.name)}</h2>
        <span class="count">${group.jobs.length} role${group.jobs.length === 1 ? "" : "s"}</span>
        <span class="chevron">&#9656;</span>
      </summary>
      ${group.jobs.map(jobRow).join("")}
    </details>`).join("");
}

const openCompanies = new Set();
list.addEventListener("toggle", event => {
  if (event.target.open) openCompanies.add(event.target.dataset.key);
  else openCompanies.delete(event.target.dataset.key);
}, true);

list.onclick = async event => {
  const statusButton = event.target.closest("button[data-status]");
  if (statusButton) {
    await fetch(`/api/jobs/${statusButton.dataset.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: statusButton.dataset.status }),
    });
    loadJobs();
    return;
  }
  const autoButton = event.target.closest("button[data-auto]");
  if (autoButton) {
    autoButton.disabled = true;
    const response = await fetch(`/api/jobs/${autoButton.dataset.auto}/autoapply`, { method: "POST" });
    const body = await response.json();
    showToast(response.ok ? "Opening the form in a browser. Review it and hit submit." : body.detail);
    autoButton.disabled = false;
  }
};

async function pollSearch() {
  const response = await fetch("/api/search/status");
  const state = await response.json();
  logWrap.hidden = !state.log.length;
  logBox.textContent = state.log.join("\n");
  logBox.scrollTop = logBox.scrollHeight;
  searchButton.disabled = boardsButton.disabled = state.running;
  if (state.running) {
    statusText.textContent = `Searching ${state.mode}...`;
    setTimeout(pollSearch, 2000);
  } else {
    statusText.textContent = state.log.length ? state.log[state.log.length - 1] : "";
    loadJobs();
  }
}

async function startSearch(boardsOnly) {
  searchButton.disabled = boardsButton.disabled = true;
  logWrap.open = true;
  await fetch(`/api/search?mode=${modeSelect.value}&boards_only=${boardsOnly}`, { method: "POST" });
  pollSearch();
}

searchButton.onclick = () => startSearch(false);
boardsButton.onclick = () => startSearch(true);
queryInput.oninput = render;
kindSelect.onchange = render;
sourceSelect.onchange = render;
loadJobs();
if (VIEW.status === "new") {
  fetch("/api/search/status").then(response => response.json()).then(state => { if (state.running) pollSearch(); });
}
</script>
</body>
</html>
