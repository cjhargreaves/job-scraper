<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Job finder</title>
<style>
  body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  nav a { margin-right: 1rem; }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .toolbar label { font-size: 0.9rem; color: #444; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 0.5rem; text-align: left; vertical-align: top; }
  td.actions { white-space: nowrap; text-align: right; width: 1%; }
  th.actions { width: 1%; }
  a.apply { display: inline-block; padding: 0.35rem 0.9rem; border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #222; text-decoration: none; font-size: 0.85rem; }
  a.apply:hover { background: #f0f0f0; }
  button.icon { min-width: 0; width: 2rem; height: 2rem; padding: 0; font-size: 1rem; line-height: 1; }
  button.icon + button.icon { margin-left: 0.3rem; }
  pre { background: #f4f4f4; padding: 0.5rem; max-height: 200px; overflow: auto; font-size: 0.85rem; }
  button { padding: 0.35rem 0.9rem; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.85rem; min-width: 5.5rem; }
  button + button { margin-left: 0.4rem; }
  button:hover { background: #f0f0f0; }
  button.trash { color: #a33; border-color: #d9a3a3; }
  button.trash:hover { background: #fbeaea; }
  button#search { background: #222; color: #fff; border-color: #222; padding: 0.5rem 1.2rem; }
  button#search:hover { background: #444; }
  button#search:disabled { background: #999; border-color: #999; cursor: default; }
  select { padding: 0.4rem; }
</style>
</head>
<body>
<nav><a href="/">Find roles</a><a href="/applied">Applied</a><a href="/trash">Trash</a></nav>
<h1>Job finder</h1>
<div class="toolbar">
  <select id="mode">
    <option value="internship">Summer internship 2027</option>
    <option value="newgrad">New grad 2027</option>
  </select>
  <button id="search">Find roles</button>
  <span id="status"></span>
</div>
<div class="toolbar">
  <label>Show
    <select id="kind">
      <option value="">All kinds</option>
      <option value="internship">Internships</option>
      <option value="newgrad">New grad</option>
    </select>
  </label>
</div>
<pre id="log" hidden></pre>
<table>
  <thead><tr><th>Company</th><th>Role</th><th>Kind</th><th>Location</th><th>Apply</th><th class="actions"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const searchButton = document.getElementById("search");
const modeSelect = document.getElementById("mode");
const kindSelect = document.getElementById("kind");
const statusText = document.getElementById("status");
const logBox = document.getElementById("log");
const rows = document.getElementById("rows");
const KIND_LABELS = { internship: "Internship", newgrad: "New grad" };

async function loadJobs() {
  const params = new URLSearchParams({ status: "new", kind: kindSelect.value });
  const response = await fetch(`/api/jobs?${params}`);
  const jobs = await response.json();
  rows.innerHTML = "";
  for (const job of jobs) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${job.company}</td>
      <td>${job.role}</td>
      <td>${KIND_LABELS[job.kind] || job.kind}</td>
      <td>${job.location}</td>
      <td><a class="apply" href="${job.url}" target="_blank">Apply</a></td>
      <td class="actions"><button class="icon applied" title="Mark applied">&#10003;</button><button class="icon trash" title="Trash">&#128465;</button></td>`;
    row.querySelector(".applied").onclick = () => setStatus(job.id, "applied");
    row.querySelector(".trash").onclick = () => setStatus(job.id, "trashed");
    rows.appendChild(row);
  }
  statusText.textContent = `${jobs.length} open`;
}

async function setStatus(id, status) {
  await fetch(`/api/jobs/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  loadJobs();
}

async function pollSearch() {
  const response = await fetch("/api/search/status");
  const state = await response.json();
  logBox.hidden = false;
  logBox.textContent = state.log.join("\n");
  logBox.scrollTop = logBox.scrollHeight;
  if (state.running) {
    statusText.textContent = `searching ${state.mode}...`;
    searchButton.disabled = true;
    setTimeout(pollSearch, 2000);
  } else {
    searchButton.disabled = false;
    loadJobs();
  }
}

searchButton.onclick = async () => {
  searchButton.disabled = true;
  await fetch(`/api/search?mode=${modeSelect.value}`, { method: "POST" });
  pollSearch();
};

kindSelect.onchange = loadJobs;
loadJobs();
fetch("/api/search/status").then(r => r.json()).then(state => { if (state.running) pollSearch(); });
</script>
</body>
</html>
